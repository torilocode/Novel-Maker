<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Editor - NovelMaker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/editor.css">
</head>

<body>

    <!-- Topbar: Título da Novel -->
    <header class="novel-header">
        <input type="text" class="novel-title-input" placeholder="New Novel" maxlength="100" spellcheck="false" autocomplete="off" autocorrect="off">
    </header>

    <!-- Layout Principal em 3 Colunas Iguais -->
    <main class="main-layout">

        <!-- Coluna 1: Characters -->
        <aside class="column">
            <div class="characters-card">
                <div class="characters-header">
                    <h2>Characters</h2>
                </div>

                <div class="card-body">
                    <div id="characters-container"></div>

                    <div class="card-footer-actions">
                        <button id="btn-add-character" class="btn-add-char" title="Add Character">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Coluna 2: Editor de Diálogos e Eventos -->
        <section class="column">
            <div id="dialogs-container"></div>

            <div class="dialogs-footer-actions">
                <button id="btn-add-dialog" class="btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Dialog
                </button>
            </div>
        </section>
    </main>

    <!-- Modal Puro de Seleção/Upload de Avatar -->
    <div class="custom-modal-overlay" id="avatarModal">
        <div class="custom-avatar-modal">
            <div class="modal-header">
                <h5>Imagem</h5>
                <button type="button" class="btn-close-modal" id="btn-close-avatar-modal" aria-label="Close">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="modal-subtitle">Escolha um avatar padrão:</p>
                <div class="avatar-options-grid">
                    <img src="/assets/l1.png" class="avatar-option" data-src="/assets/l1.png" alt="Avatar 1">
                    <img src="/assets/l2.png" class="avatar-option" data-src="/assets/l2.png" alt="Avatar 2">
                    <img src="/assets/l3.png" class="avatar-option" data-src="/assets/l3.png" alt="Avatar 3">
                    <img src="/assets/l4.png" class="avatar-option" data-src="/assets/l4.png" alt="Avatar 4">
                </div>

                <hr class="modal-divider">

                <label class="btn-select-avatar">
                    Upload Custom Avatar
                    <input type="file" accept="image/*" class="hidden-input" id="btn-fake-upload">
                </label>
            </div>
        </div>
    </div>

    <script src="/js/editor.js"></script>
</body>

</html>
