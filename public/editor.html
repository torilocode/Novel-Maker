<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Editor - NovelMaker</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts (Poppins para a interface e Roboto Mono para o roteiro) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Nosso arquivo CSS externo -->
    <link rel="stylesheet" href="/css/editor.css">
</head>

<body>

    <!-- Topbar: Título do Projeto -->
    <header class="story-header mb-5">
        <input type="text" class="novel-title-input" placeholder="New Novel" maxlength="100" spellcheck="false" autocomplete="off" autocorrect="off">
    </header>

    <main class="container col-md-8 col-lg-5 pb-5">

        <!-- CENA 1 -->
        <div class="scene-card mb-4">
            <div class="scene-header">
                <input type="text" class="scene-title-input" placeholder="New Scene" maxlength="30" spellcheck="false" autocomplete="off" autocorrect="off">

                <div class="toolbar d-flex gap-2">
                    <button class="toolbar-btn" title="Bold">B</button>
                    <button class="toolbar-btn" title="Italic"><i>I</i></button>
                    <button class="toolbar-btn" title="Undo"><i class="bi bi-arrow-counterclockwise"></i></button>
                    <button class="toolbar-btn" title="Redo"><i class="bi bi-arrow-clockwise"></i></button>
                </div>
            </div>
            <textarea class="scene-editor" placeholder="Escreva o roteiro aqui..."></textarea>
        </div>

        <!-- Botão Inferior de Adicionar Cena -->
        <div class="text-center mt-4">
            <button class="btn btn-add-scene shadow">
                <span class="plus-icon"><i class="bi bi-plus-lg"></i></span>
                Add Scene
            </button>
        </div>

    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Nosso arquivo JavaScript externo -->
    <script src="/js/editor.js"></script>
</body>

</html>
