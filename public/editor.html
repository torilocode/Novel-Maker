<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Editor - NovelMaker</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/editor.css">
</head>

<body>

    <!-- Topbar: Título da Novel -->
    <header class="novel-header mb-4">
        <input type="text" class="novel-title-input" placeholder="New Novel" maxlength="100" spellcheck="false" autocomplete="off" autocorrect="off">
    </header>

    <!-- Container do Layout (Sidebar Esquerda + Editor Central + StoryTab Direita) -->
    <main class="container-fluid px-4 pb-5">
        <div class="row g-4 justify-content-center">

            <!-- Sidebar Esquerda: Characters -->
            <aside class="col-12 col-md-3 col-lg-3">
                <div class="characters-card">
                    <div class="characters-header">
                        <h2>Characters</h2>
                    </div>

                    <div class="characters-body p-3">
                        <div id="characters-container"></div>

                        <div class="text-center mt-3">
                            <button id="btn-add-character" class="btn-add-char" title="Add Character">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Área Central: Editor de Diálogos e Eventos -->
            <section class="col-12 col-md-6 col-lg-6">
                <div id="dialogs-container"></div>

                <div class="text-center mt-4">
                    <button id="btn-add-dialog" class="btn btn-add-dialog shadow">
                        <span class="plus-icon"><i class="bi bi-plus-lg"></i></span>
                        Add Dialog
                    </button>
                </div>
            </section>

            <!-- Sidebar Direita: Story Structure (StoryTab) -->
            <aside class="col-12 col-md-3 col-lg-3">
                <div class="story-card">
                    <div class="story-header">
                        <h2>Story</h2>
                    </div>

                    <div class="story-body p-3">
                        <div id="chapters-container"></div>

                        <div class="text-center mt-3">
                            <button id="btn-add-chapter" class="btn-add-chapter" title="Add Chapter">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

        </div>
    </main>

    <!-- Modal de Seleção/Upload de Avatar -->
    <div class="modal fade" id="avatarModal" tabindex="-1" aria-labelledby="avatarModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-avatar-modal">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title font-weight-bold" id="avatarModalLabel">Imagem</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center py-4">
            
            <p class="text-white-50 small mb-3">Escolha um avatar padrão:</p>
            <div class="d-flex justify-content-center gap-3 mb-4">
                <img src="/assets/l1.png" class="avatar-option" data-src="/assets/l1.png" alt="Avatar 1">
                <img src="/assets/l2.png" class="avatar-option" data-src="/assets/l2.png" alt="Av   atar 2">
                <img src="/assets/l3.png" class="avatar-option" data-src="/assets/l3.png" alt="Avatar 3">
                <img src="/assets/l4.png" class="avatar-option" data-src="/assets/l4.png" alt="Avatar 4">
            </div>

            <div class="my-3 border-top border-secondary opacity-25"></div>

            <label class="btn btn-select-avatar shadow mt-2">
                Upload Custom Avatar
                <input type="file" accept="image/*" class="d-none" id="btn-fake-upload">
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/editor.js"></script>
</body>

</html>
