<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer - NovelMaker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/css/writer.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="app-layout">
        <!-- Left Side Navbar (Uniform with index.html) -->
        <!-- Left Side Navbar -->
        <aside class="side-navbar">
            <div class="nav-top">
                <a href="/" class="side-nav-btn" title="Home">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </a>
            </div>

            <nav class="nav-items">
                <a href="/writer" class="side-nav-btn" title="Writer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                </a>
                <button type="button" class="place-holder-btn" title="Projects">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                </button>
            </nav>

            <!-- Bottom Section: User + Settings -->
            <div class="nav-bottom">
                <div class="user-menu-wrapper">
                    <button type="button" class="side-nav-btn" id="btn-user-menu" title="User Account">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>

                    <div class="user-popup hidden" id="user-popup">
                        <div class="user-popup-header">
                            <span class="popup-nickname">Elena Vance</span>
                            <span class="popup-handle">@elenavance</span>
                        </div>
                        <a href="/profile" class="btn-go-profile">Go to User Profile</a>
                    </div>
                </div>

                <button type="button" class="place-holder-btn" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main Editor Area -->
        <main class="editor-workspace">
            <!-- Top Toolbar -->
            <header class="editor-topbar">
                <input type="text" class="doc-title-input" placeholder="Novel Title..." maxlength="100"
                    spellcheck="false" autocomplete="off">

                <div class="toolbar">
                    <button type="button" class="toolbar-btn" id="btn-bold" title="Bold">B</button>
                    <button type="button" class="toolbar-btn" id="btn-italic" title="Italic"><i>I</i></button>
                    <button type="button" class="toolbar-btn" id="btn-undo" title="Undo">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 7v6h6"></path>
                            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                        </svg>
                    </button>
                    <button type="button" class="toolbar-btn" id="btn-redo" title="Redo">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 7v6h-6"></path>
                            <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Workspace Body: Text Editor + Right Chapters Sidebar -->
            <div class="workspace-body">
                <!-- Fullscreen Text Editor -->
                <div class="writer-canvas" id="writer-canvas">
                    <div id="writer-editor" class="writer-editor" contenteditable="true"
                        data-placeholder="Start writing your story here..." data-empty="true" spellcheck="false"></div>
                </div>

                <!-- Resizable Divider -->
                <div class="chapters-resizer" id="chapters-resizer" title="Drag to resize"></div>

                <!-- Right Chapters Sidebar -->
                <aside class="chapters-sidebar" id="chapters-sidebar">
                    <div class="chapters-sidebar-header">
                        <span>Chapters in document</span>
                        <button type="button" class="btn-add-chapter" id="btn-add-chapter" title="Add Chapter">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>

                    <ul class="chapters-list" id="chapters-list"></ul>

                    <!-- Hide Button at the bottom of the Chapters Panel -->
                    <div class="chapters-sidebar-footer">
                        <button type="button" class="btn-hide-chapters" id="btn-hide-chapters"
                            title="Hide Chapters Panel">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="15" y1="3" x2="15" y2="21"></line>
                                <polyline points="8 9 11 12 8 15"></polyline>
                            </svg>
                            <span>Hide Chapters</span>
                        </button>
                    </div>
                </aside>

                <!-- Circular Button at Bottom-Right (Appears when Chapters Panel is hidden) -->
                <button type="button" class="btn-show-chapters-circle hidden" id="btn-show-chapters"
                    title="Show Chapters Panel">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="15" y1="3" x2="15" y2="21"></line>
                        <polyline points="8 9 11 12 8 15"></polyline>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <script src="/js/writer.js"></script>
    <script src="/js/script.js"></script>
</body>

</html>
